cv:
  name: YuHeng Wang
  label: "<span class='lang-en'>Data Science Undergraduate</span><span class='lang-zh'>数据科学本科生</span>"
  email: ywangrg@connect.ust.hk
  location: Hong Kong SAR
  image: ""
  summary: "<span class='lang-en'>Final-year Data Science undergraduate at HKUST with a strong foundation in **machine learning, computer vision, statistical modeling, and programming**. Trained a U-Net model for cardiac detection and segmentation on X-ray images, achieving 90%+ accuracy and a 0.7992 F1-score. Conducted research with Prof. Gary Chan on floorplan-guided 3D reconstruction using 2D floorplans as structural priors. During a tech internship, collected 3D food point-cloud data and built a volume-estimation algorithm from scratch, <mark>reducing MAPE from 25.4% to 12.36%</mark>. Also self-studied full-stack development with working knowledge of both front-end and back-end engineering. Currently seeking opportunities in data analytics and AI/CV research.</span><span class='lang-zh'>香港科技大学数据科学专业大四本科生，在**机器学习、计算机视觉、统计建模与编程**方面基础扎实。曾训练用于 X 光图像心脏检测与分割的 U-Net 模型，准确率超 90%，F1 分数 0.7992。在 Gary Chan 教授指导下开展基于 2D 户型图结构先验的 3D 重建研究。在技术实习中采集 3D 食物点云数据，并从零构建体积估计算法，<mark>将 MAPE 从 25.4% 降至 12.36%</mark>。同时自学全栈开发，掌握前端与后端工程知识。目前正在寻找数据分析与 AI/CV 研究方向的机会。</span>"

  social_networks:
    - network: GitHub
      username: Wangyh666-ust

  sections:
    Education:
      - institution: The Hong Kong University of Science and Technology (HKUST)
        location: Hong Kong SAR
        url: https://hkust.edu.hk/
        area: Data Science
        studyType: B.Sc.
        start_date: 2023-09
        end_date: 2027-06
        highlights:
          - "<span class='lang-en'>GPA 3.733/4.3 (Major GPA 3.834), Top 10%</span><span class='lang-zh'>GPA 3.733/4.3（专业 GPA 3.834），排名前 10%</span>"
          - "<span class='lang-en'>Expected graduation: June 2027</span><span class='lang-zh'>预计 2027 年 6 月毕业</span>"
          - "<span class='lang-en'>Mathematics & Statistics: Honours Calculus I/II (A), Multivariable Calculus (A+), Statistics (A), Honours Probability (A+), Mathematical Analysis (A), Matrix Computation (A), Matrix Differentiation (A), Bayesian Statistics (A), Statistical Inference (A)</span><span class='lang-zh'>数学与统计：荣誉微积分 I/II（A）、多元微积分（A+）、统计学（A）、荣誉概率论（A+）、数学分析（A）、矩阵计算（A）、矩阵微分（A）、贝叶斯统计（A）、统计推断（A）</span>"
          - "<span class='lang-en'>Computer Science & ML: C++ & Data Structures (A), Discrete Mathematics (A+), Machine Learning (A), Algorithms (B+)</span><span class='lang-zh'>计算机与机器学习：C++ 与数据结构（A）、离散数学（A+）、机器学习（A）、算法（B+）</span>"

    # NOTE: this title must stay exactly "Experience" — the CV template only
    # renders company/position/date entries richly for that fixed section name.
    Experience:
      - company: "HKUST UROP / Course Project (Supervisor: Prof. Gary Chan)"
        position: Undergraduate Researcher — 3D Point Cloud Reconstruction
        location: Hong Kong SAR
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - "<span class='lang-en'>Developed a floorplan-guided framework that aligns and fuses multi-view point clouds using 2D floorplans as structural priors, improving geometric consistency and scale normalization for indoor 3D scenes (digital twins, robotics, BIM).</span><span class='lang-zh'>开发了户型图引导的框架，利用 2D 户型图作为结构先验对多视角点云进行对齐与融合，提升室内 3D 场景的几何一致性与尺度归一化（应用于数字孪生、机器人、BIM）。</span>"

    # NOTE: same constraint — "Projects" is a fixed section name with rich
    # rendering (title/link, date badge, highlights). Custom names render plain.
    Projects:
      - name: Research Intern — Medical Image Segmentation, Seoul National University (SNU–HKUST Sponsored Project)
        date: 2025
        highlights:
          - "<span class='lang-en'>Built and trained a U-Net model for automated heart detection, localization, and segmentation on chest X-ray images, achieving 90%+ accuracy and a 0.7992 F1-score.</span><span class='lang-zh'>构建并训练 U-Net 模型，在胸部 X 光图像上实现自动化心脏检测、定位与分割，准确率超 90%，F1 分数 0.7992。</span>"

      - name: FYP — Towards a Personal Embodied AI Agent with Reinforcement Learning, HKUST
        start_date: 2026-01
        end_date: Present
        highlights:
          - "<span class='lang-en'>Developing a perception–action pipeline in PyTorch with reinforcement learning, enabling an embodied agent to perform visual search and manipulation tasks from natural-language instructions.</span><span class='lang-zh'>基于 PyTorch 与强化学习开发感知–动作流水线，使具身智能体能够根据自然语言指令执行视觉搜索与操作任务。</span>"

      - name: Computer Vision Intern — Food Volume Estimation, AIxHealthcare Lab (Shenzhen Zhijie Exploration Technology)
        date: 2026
        highlights:
          - "<span class='lang-en'>Built a food-volume estimation algorithm from scratch for a nutrition-estimation application; reduced MAPE to 12.36% on the test set (vs. ~20% with the company's original method) after one and a half months of development.</span><span class='lang-zh'>为营养估计应用从零构建食物体积估计算法；经过一个半月的开发，将测试集 MAPE 降至 12.36%（公司原有方法约为 20%）。</span>"
          - "<span class='lang-en'>Explored state-of-the-art 3D reconstruction models (VGGT-Omega, Pi3X, DA3, MASt3R, etc.) and gained hands-on experience with the full algorithm development cycle.</span><span class='lang-zh'>调研了最先进的 3D 重建模型（VGGT-Omega、Pi3X、DA3、MASt3R 等），获得了算法开发全周期的实践经验。</span>"

      - name: Data Visualization Project — Visualizing AI's Impact on the Job Market
        url: https://github.com/TheLogarhythm/Career-a-vis-AI
        date: 2026
        highlights:
          - "<span class='lang-en'>Created a visualization exploring AI's impact on the job market.</span><span class='lang-zh'>创建了探索 AI 对就业市场影响的可视化作品。</span>"
          - "<span class='lang-en'>Gained hands-on experience with data visualization tools including Datawrapper, Tableau, pandas, iNZight, and RAWGraphs.</span><span class='lang-zh'>获得了 Datawrapper、Tableau、pandas、iNZight、RAWGraphs 等数据可视化工具的实践经验。</span>"

