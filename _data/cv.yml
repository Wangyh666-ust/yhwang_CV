  location: "<span class='lang-en'>Shenzhen, China</span><span class='lang-zh'>深圳，中国</span>"
  phone: "+86 137 1424 1526"
  website: https://wangyh666-ust.github.io
  image: ""
  summary: "<span class='lang-en'>Final-year Data Science undergraduate at HKUST with a strong foundation in **machine learning, computer vision, statistical modeling, and programming**. Trained a U-Net model for cardiac detection and segmentation on X-ray images, achieving 90%+ accuracy and a 0.7992 F1-score. Conducted research with Prof. Gary Chan on floorplan-guided 3D reconstruction using 2D floorplans as structural priors. During a tech internship, collected 3D food point-cloud data and built a volume-estimation algorithm from scratch, reducing MAPE from 25.4% to 12.36%. Also self-studied full-stack development with working knowledge of both front-end and back-end engineering. Currently seeking opportunities in data analytics and AI/CV research.</span><span class='lang-zh'>香港科技大学（HKUST）数据科学专业四年级本科生，扎实掌握**机器学习、计算机视觉、统计建模与编程**。曾训练 U-Net 模型实现 X 光片心脏自动检测与分割，准确率超 90%，F1 分数 0.7992；与 Gary Chan 教授合作研究基于 2D 户型图结构先验的 3D 重建；在深圳智界探索科技有限公司（AIxHealthcare Lab，迈瑞医疗原高级副总裁创办的 AI 健康公司）实习期间，从零搭建食物体积估计算法，将 MAPE 从 25.4% 降至 12.36%。目前正与张婕教授开展基于强化学习的具身智能体 FYP 研究，并自学了全栈开发（前后端均有基础）。求职方向：数据分析、AI/计算机视觉研究。</span>"

  social_networks:
    - network: GitHub
      username: Wangyh666-ust

  sections:
    Education:
      - institution: "<span class='lang-en'>The Hong Kong University of Science and Technology (HKUST)</span><span class='lang-zh'>香港科技大学（HKUST）</span>"
        location: "<span class='lang-en'>Hong Kong</span><span class='lang-zh'>香港</span>"
        url: https://hkust.edu.hk/
        area: "<span class='lang-en'>Data Science</span><span class='lang-zh'>数据科学</span>"
        studyType: "<span class='lang-en'>B.Sc.</span><span class='lang-zh'>理学学士</span>"
        start_date: 2023-09
        end_date: 2027-06
        highlights:
          - "<span class='lang-en'>GPA 3.733/4.3 (Major GPA 3.834), Top 10%</span><span class='lang-zh'>GPA 3.733/4.3（专业 GPA 3.834），排名前 10%</span>"
          - "<span class='lang-en'>Mathematics & Statistics: Honours Calculus I/II (A), Multivariable Calculus (A+), Statistics (A), Honours Probability (A+), Mathematical Analysis (A), Matrix Computation (A), Matrix Differentiation (A), Bayesian Statistics (A), Statistical Inference (A)</span><span class='lang-zh'>数学与统计：荣誉微积分 I/II（A）、多变量微积分（A+）、统计学（A）、荣誉概率论（A+）、数学分析（A）、矩阵计算（A）、矩阵微分（A）、贝叶斯统计（A）、统计推断（A）</span>"
          - "<span class='lang-en'>Computer Science & ML: C++ & Data Structures (A), Discrete Mathematics (A+), Machine Learning (A), Algorithms (B+)</span><span class='lang-zh'>计算机与机器学习：C++ 与数据结构（A）、离散数学（A+）、机器学习（A）、算法（B+）</span>"

    # NOTE: this title must stay exactly "Experience" — the CV template only
    # renders company/position/date entries richly for that fixed section name.
    Experience:
      - company: "<span class='lang-en'>HKUST UROP / Course Project</span><span class='lang-zh'>HKUST UROP / 课程项目</span>"
        position: "<span class='lang-en'>Undergraduate Researcher — 3D Point Cloud Reconstruction</span><span class='lang-zh'>本科生研究员 — 3D 点云重建</span>"
        location: "<span class='lang-en'>Hong Kong</span><span class='lang-zh'>香港</span>"
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - "<span class='lang-en'>Developed a floorplan-guided framework that aligns and fuses multi-view point clouds using 2D floorplans as structural priors, improving geometric consistency and scale normalization for indoor 3D scenes (digital twins, robotics, BIM).</span><span class='lang-zh'>开发户型图引导的点云融合框架，利用 2D 户型图作为结构先验进行多视角点云对齐与融合，提升室内 3D 场景（数字孪生、机器人、BIM）的几何一致性与尺度归一化效果。</span>"

    # NOTE: same constraint — "Projects" is a fixed section name with rich
    # rendering (title/link, date badge, highlights). Custom names render plain.
    Projects:
      - name: "<span class='lang-en'>Alpha Factor Mining Pipeline — WorldQuant BRAIN</span><span class='lang-zh'>Alpha 因子挖掘自动化流水线 — WorldQuant BRAIN</span>"
        date: 2026
        highlights:
          - "<span class='lang-en'>Built an end-to-end pipeline that automated simulation, result polling and submission planning on the BRAIN platform (1,354 simulations; 15 alphas submitted, all live; best fitness 3.88).</span><span class='lang-zh'>搭建端到端流水线，自动完成 BRAIN 平台的仿真提交、结果轮询与提交方案求解（累计 1354 次仿真；15 条 Alpha 已提交上线；最佳 fitness 3.88）。</span>"
          - "<span class='lang-en'>Reverse-engineered six of the platform's admission rules from my own results, so candidates could be judged before submission; showed the co-existence constraint is a maximum-clique problem — 22 alphas cleared the gates but only 4 could be submitted together.</span><span class='lang-zh'>用自有结果逆向出平台 6 条判定规则，使候选在提交前即可预判是否通过；并指出平台共存约束本质是最大团问题——22 条通过闸门，实际只能同时提交 4 条。</span>"

      - name: "<span class='lang-en'>Kaggle Competition — Kaggriculture: Two-Player Farming-Economy Agent</span><span class='lang-zh'>Kaggle 竞赛 — Kaggriculture：双人农业经营 agent</span>"
        url: https://www.kaggle.com/competitions/kaggriculture
        date: 2026
        highlights:
          - "<span class='lang-en'>Built a 720-turn two-player farming agent for the Kaggle Kaggriculture ladder, reaching a ladder Elo of 2452.2 (about 850th of ~8,000 teams).</span><span class='lang-zh'>参加 720 回合的双人农业经营 agent 竞赛，天梯 Elo 达到 2452.2，约 8000 支队伍中排名第 850 名。</span>"
          - "<span class='lang-en'>Built a paired multi-seed tournament harness (dual-seat, ≥500 games per arm, two independent seed blocks) and used it to isolate one decisive constant, lifting the win rate against the strongest local opponent from 37.5% to 93.1%.</span><span class='lang-zh'>自建配对多种子巡回赛评测框架（双座位、每臂 ≥500 局、两个独立种子块），据此定位出决定性的单一常量，对本地最强对手胜率由 37.5% 提升至 93.1%。</span>"

      - name: "<span class='lang-en'>Research Intern — Medical Image Segmentation, Seoul National University (SNU–HKUST Sponsored Project)</span><span class='lang-zh'>研究实习生 — 医学图像分割，首尔国立大学（SNU-HKUST 联合资助项目）</span>"
        date: 2025
        highlights:
          - "<span class='lang-en'>Built and trained a U-Net model for automated heart detection, localization, and segmentation on chest X-ray images, achieving 90%+ accuracy and a 0.7992 F1-score.</span><span class='lang-zh'>搭建并训练 U-Net 模型，实现胸部 X 光片中心脏的自动检测、定位与分割，准确率超 90%，F1 分数 0.7992。</span>"

      - name: "<span class='lang-en'>FYP — Towards a Personal Embodied AI Agent with Reinforcement Learning</span><span class='lang-zh'>毕业论文（FYP）— 基于强化学习的个人具身智能体</span>"
        start_date: 2026-01
        end_date: Present
        highlights:
          - "<span class='lang-en'>Developing a perception–action pipeline in PyTorch with reinforcement learning, enabling an embodied agent to perform visual search and manipulation tasks from natural-language instructions.</span><span class='lang-zh'>基于 PyTorch 与强化学习开发感知–动作流水线，使具身智能体能够根据自然语言指令执行视觉搜索与物体操控任务。</span>"

      - name: "<span class='lang-en'>Computer Vision Intern — Food Volume Estimation, AIxHealthcare Lab (Shenzhen Zhijie Exploration Technology Co., Ltd.)</span><span class='lang-zh'>计算机视觉实习生 — 食物体积估计，深圳智界探索科技有限公司（AIxHealthcare Lab）</span>"
        date: 2026
        highlights:
          - "<span class='lang-en'>Built a food-volume estimation algorithm from scratch for a nutrition-estimation application; reduced MAPE to 12.36% on the test set (vs. ~20% with the company's original method) after one and a half months of development.</span><span class='lang-zh'>为一款营养估算应用从零开发食物体积估计算法，历时一个半月将测试集 MAPE 降至 12.36%（公司原有方法约 25%）。</span>"
          - "<span class='lang-en'>Explored state-of-the-art 3D reconstruction models (VGGT-Omega, Pi3X, DA3, MASt3R, etc.) and gained hands-on experience with the full algorithm development cycle.</span><span class='lang-zh'>调研了 VGGT-Omega、Pi3X、DA3、MASt3R 等前沿 3D 重建模型，完整经历了算法从调研、开发到测试的全流程。</span>"

      - name: "<span class='lang-en'>Data Visualization Project</span><span class='lang-zh'>数据可视化项目</span>"
        url: https://github.com/TheLogarhythm/Career-a-vis-AI
        date: 2026
        highlights:
          - "<span class='lang-en'>Created a visualization exploring AI's impact on the job market.</span><span class='lang-zh'>主题：AI 对就业市场影响的可视化研究。</span>"
          - "<span class='lang-en'>Gained hands-on experience with data visualization tools including Datawrapper, Tableau, pandas, iNZight, and RAWGraphs.</span><span class='lang-zh'>使用 Datawrapper、Tableau、Pandas、iNZight、RAWGraphs 等工具进行多维度数据挖掘与分析。</span>"

      - name: "<span class='lang-en'>Full-Stack Development (Self-Study) — Personal Website</span><span class='lang-zh'>全栈开发（自学）— 个人网站</span>"
        url: http://120.79.180.47
        start_date: 2026-08
        end_date: Present
        highlights:
          - "<span class='lang-en'>Self-studied full-stack development and built a personal website to present my experience and showcase projects (in progress).</span><span class='lang-zh'>自学全栈开发，正在搭建个人网站用于展示个人经历与项目成果。</span>"

